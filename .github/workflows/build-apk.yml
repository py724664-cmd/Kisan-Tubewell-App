name: Build Kisan Tubewell APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Kisan_Tubewell_GitHub_APK_Build.zip -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisan-Tubewell-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
